<script type="module">
import * as THREE from 'three';

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 400);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3a4a2f, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(30, 45, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.far = 120;
scene.add(sun);

/* ---------- world building helpers ---------- */
const R = 0.45;
function makeWorld(){
  const group = new THREE.Group();
  const solids = [];
  const pads = [];
  const balls = [];
  function box(w, h, d, x, y, z, color, emissive, noCollide){
    const mat = new THREE.MeshStandardMaterial({ color, roughness:.85, metalness:.05 });
    if(emissive){ mat.emissive = new THREE.Color(emissive); mat.emissiveIntensity = .55; }
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y + h/2, z);
    m.castShadow = m.receiveShadow = true;
    group.add(m);
    if(!noCollide) solids.push({ x0:x-w/2, x1:x+w/2, y0:y, y1:y+h, z0:z-d/2, z1:z+d/2 });
    return m;
  }
  function plane(w, d, x, y, z, color, ry){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
      new THREE.MeshStandardMaterial({ color, roughness:.9 }));
    m.rotation.x = -Math.PI/2;
    if(ry) m.rotation.z = ry;
    m.position.set(x, y, z);
    m.receiveShadow = true;
    group.add(m);
    return m;
  }
  return { group, solids, pads, balls, box, plane };
}

/* ================= DORM ROOM ================= */
function buildDorm(){
  const w = makeWorld();
  const { box, plane, pads } = w;
  // floor + ceiling + walls (10 x 8, height 3.2)
  plane(10, 8, 0, 0, 0, 0xc9a876);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(10, 8),
    new THREE.MeshStandardMaterial({ color:0xf2ede4, roughness:1 }));
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, 3.2, 0); w.group.add(ceil);
  const WC = 0x9fb4d8;
  box(10, 3.2, .4,  0, 0, -4.2, WC);
  box(10, 3.2, .4,  0, 0,  4.2, WC);
  box(.4, 3.2, 8, -5.2, 0, 0, WC);
  box(.4, 3.2, 8,  5.2, 0, 0, WC);
  // bed (collider covers frame+mattress so feet rest on top)
  box(2.2, 1.28, 3.4, -3, 0, -1.8, 0x8b5a2b);
  box(2.0, .28, 3.2, -3, 1.0, -1.8, 0xf5f0e6, null, true);
  box(1.4, .18, .7, -3, 1.28, -3.0, 0xffffff, null, true);
  box(2.0, .1, 1.6, -3, 1.28, -1.0, 0x3b82f6, null, true);
  // desk + monitor + chair
  box(2.6, .86, 1.3, 2.8, 0, -2.6, 0x6b4a2f);
  box(.9, .6, .12, 2.8, .86, -2.9, 0x1a1a1a, null, true);
  box(.5, .1, .5, 2.8, .86, -2.55, 0x333333, null, true);
  box(.9, .55, .9, 2.8, 0, -.9, 0x444c5e);
  box(.9, .8, .14, 2.8, .55, -.5, 0x444c5e, null, true);
  // rug
  const rug = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, .04, 28),
    new THREE.MeshStandardMaterial({ color:0x8b5cf6, roughness:1 }));
  rug.position.set(.6, .02, 1.2); rug.receiveShadow = true; w.group.add(rug);
  // window (emissive) on north wall
  box(2.8, 2.0, .1, 1.5, 1.0, -4.05, 0x3a3f4a);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6),
    new THREE.MeshBasicMaterial({ color:0xbfe9ff }));
  win.position.set(1.5, 2.0, -3.98); w.group.add(win);
  // door on south wall
  box(1.3, 2.5, .12, -2.5, 0, 4.05, 0x6b4a2f);
  // shelf + books
  box(2.2, .12, .6, 4.2, 1.9, -3.9, 0x6b4a2f);
  box(.3, .5, .4, 3.6, 2.02, -3.9, 0xef4444, null, true);
  box(.3, .5, .4, 3.95, 2.02, -3.9, 0x22c55e, null, true);
  box(.3, .5, .4, 4.3, 2.02, -3.9, 0x3b82f6, null, true);
  // poster on east wall
  const poster = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.3),
    new THREE.MeshStandardMaterial({ color:0xf472b6, roughness:.9 }));
  poster.rotation.y = -Math.PI/2; poster.position.set(4.98, 1.8, 1.5); w.group.add(poster);
  // warm lamp light
  const lamp = new THREE.PointLight(0xffd9a0, 12, 12);
  lamp.position.set(0, 2.9, 0); w.group.add(lamp);
  return { ...w, spawn:{ pos:new THREE.Vector3(0, 0, 2.6), yaw:0 } };
}

/* ================= REC CENTER ================= */
function checkerTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#e8edf5'; g.fillRect(0,0,128,128);
  g.fillStyle = '#b9c6e2'; g.fillRect(0,0,64,64); g.fillRect(64,64,64,64);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(22, 22);
  return t;
}
function buildRecCenter(){
  const w = makeWorld();
  const { box, pads, balls, group } = w;
  const W = 22; // half-size
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W*2, W*2),
    new THREE.MeshStandardMaterial({ map:checkerTexture(), roughness:.9 }));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; group.add(floor);
  // walls
  box(W*2, 9, 1,  0, 0, -W, 0xff6b35);
  box(W*2, 9, 1,  0, 0,  W, 0x3b82f6);
  box(1, 9, W*2, -W, 0, 0, 0x22c55e);
  box(1, 9, W*2,  W, 0, 0, 0xa855f7);
  // center emblem
  const emblem = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, .08, 40),
    new THREE.MeshStandardMaterial({ color:0x8b5cf6, emissive:0x8b5cf6, emissiveIntensity:.35, roughness:.6 }));
  emblem.position.set(0, .04, 0); emblem.receiveShadow = true; group.add(emblem);
  // stage (north)
  const stage = new THREE.Mesh(new THREE.CylinderGeometry(6, 6.4, 1.2, 36),
    new THREE.MeshStandardMaterial({ color:0x7c3aed, roughness:.8 }));
  stage.position.set(0, .6, -12); stage.castShadow = stage.receiveShadow = true; group.add(stage);
  w.solids.push({ x0:-6, x1:6, y0:0, y1:1.2, z0:-18, z1:-6 });
  // stairs to stage (ascending toward the stage)
  box(5, .4, 1.2, 0, 0, -3.4, 0xfbbf24);
  box(5, .8, 1.2, 0, 0, -4.6, 0xf59e0b);
  // pillars
  [[-14,-14],[14,-14],[-14,14],[14,14]].forEach(([x,z]) => box(1.6, 9, 1.6, x, 0, z, 0xe2e8f0));
  // benches
  box(4, .5, 1.2, -8, 0, 8, 0xb08968);
  box(4, .5, 1.2, 8, 0, 8, 0xb08968);
  // banners on walls
  const bannerMat = new THREE.MeshBasicMaterial({ color:0xfacc15 });
  [[-8,-W+.6,0],[8,-W+.6,0]].forEach(([x,z]) => {
    const b = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.4), bannerMat);
    b.position.set(x, 6, z); group.add(b);
  });
  // bounce pads
  function bouncePad(x, z){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.5, .3, 24),
      new THREE.MeshStandardMaterial({ color:0x22ff88, emissive:0x22ff88, emissiveIntensity:.8, roughness:.4 }));
    m.position.set(x, .15, z); m.receiveShadow = true; group.add(m);
    pads.push({ x, z, r:1.4 });
  }
  bouncePad(-6, 4); bouncePad(6, 4);
  // bouncy balls
  const ballColors = [0xff4757, 0x2ed573, 0x1e90ff, 0xffa502, 0xeccc68, 0x7bed9f, 0x70a1ff, 0xff6b81];
  for(let i = 0; i < 8; i++){
    const r = .45 + Math.random() * .25;
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18),
      new THREE.MeshStandardMaterial({ color:ballColors[i], roughness:.35 }));
    mesh.castShadow = true; group.add(mesh);
    balls.push({
      mesh, r,
      pos: new THREE.Vector3((Math.random()-.5)*28, 3 + Math.random()*4, (Math.random()-.5)*28),
      vel: new THREE.Vector3((Math.random()-.5)*6, 0, (Math.random()-.5)*6)
    });
  }
  return { ...w, spawn:{ pos:new THREE.Vector3(0, 0, 15), yaw:0 }, wall:W };
}

/* ---------- scenes ---------- */
const scenes = { dorm: buildDorm(), rec: buildRecCenter() };
scene.add(scenes.dorm.group);
scene.add(scenes.rec.group);
let current = 'dorm';
let solids = scenes.dorm.solids;
let pads = scenes.dorm.pads;
let balls = scenes.dorm.balls;
let WALL = 5;

/* ---------- player ---------- */
const pos = new THREE.Vector3();
const vel = new THREE.Vector3();
let yaw = 0, pitch = 0, grounded = false;
const keys = {};
addEventListener('keydown', e => {
  if(e.code === 'Tab'){ e.preventDefault(); toggleWatch(); return; }
  keys[e.code] = true;
  if(e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function setScene(name){
  current = name;
  const s = scenes[name];
  scenes.dorm.group.visible = name === 'dorm';
  scenes.rec.group.visible = name === 'rec';
  solids = s.solids; pads = s.pads; balls = s.balls;
  WALL = s.wall || 5;
  pos.copy(s.spawn.pos); vel.set(0, 0, 0);
  yaw = s.spawn.yaw; pitch = 0;
  document.getElementById('tag').textContent =
    '◈ RecNova · ' + (name === 'dorm' ? 'Dorm Room' : 'Rec Center');
  updateWatchButtons();
}

/* ---------- the watch ---------- */
const watchEl = document.getElementById('watch');
const wDorm = document.getElementById('w-dorm');
const wRec = document.getElementById('w-rec');
let watchOpen = false;
function updateWatchButtons(){
  const inDorm = current === 'dorm';
  wDorm.disabled = inDorm;
  wRec.disabled = !inDorm;
  wDorm.querySelector('.sub').textContent = inDorm ? "You're here" : 'Teleport';
  wRec.querySelector('.sub').textContent = !inDorm ? "You're here" : 'Teleport';
  const d = new Date();
  document.getElementById('wtime').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  document.getElementById('wdate').textContent = d.toLocaleDateString(undefined,
    { weekday:'long', month:'long', day:'numeric' });
}
function openWatch(){
  if(document.pointerLockElement) document.exitPointerLock();
  updateWatchButtons();
  watchEl.classList.remove('hidden');
  watchOpen = true;
}
function closeWatch(){ watchEl.classList.add('hidden'); watchOpen = false; }
function toggleWatch(){ watchOpen ? closeWatch() : openWatch(); }
function lockPointer(){ renderer.domElement.requestPointerLock(); }
wDorm.onclick = () => { setScene('dorm'); closeWatch(); lockPointer(); };
wRec.onclick = () => { setScene('rec'); closeWatch(); lockPointer(); };
document.getElementById('w-resume').onclick = () => { closeWatch(); lockPointer(); };
document.getElementById('watchbtn').onclick = () => openWatch();

/* ---------- pointer lock / overlay ---------- */
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
let locked = false;
overlay.addEventListener('click', () => lockPointer());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', locked || watchOpen);
  hud.style.display = (locked && !watchOpen) ? 'block' : 'none';
});
document.addEventListener('mousemove', e => {
  if(!locked) return;
  yaw   -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
});

/* ---------- collision ---------- */
function supportAt(x, z, feetY){
  let s = 0;
  for(const b of solids){
    if(x > b.x0 - R && x < b.x1 + R && z > b.z0 - R && z < b.z1 + R &&
       b.y1 <= feetY + 0.55 && b.y1 > s) s = b.y1;
  }
  return s;
}
function collideHoriz(){
  for(const b of solids){
    if(pos.y + 1.6 < b.y0 || pos.y > b.y1 - 0.35) continue;
    const nx0 = b.x0 - R, nx1 = b.x1 + R, nz0 = b.z0 - R, nz1 = b.z1 + R;
    if(pos.x > nx0 && pos.x < nx1 && pos.z > nz0 && pos.z < nz1){
      const dxl = pos.x - nx0, dxr = nx1 - pos.x;
      const dzl = pos.z - nz0, dzr = nz1 - pos.z;
      const m = Math.min(dxl, dxr, dzl, dzr);
      if(m === dxl) pos.x = nx0;
      else if(m === dxr) pos.x = nx1;
      else if(m === dzl) pos.z = nz0;
      else pos.z = nz1;
    }
  }
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3();
setScene('dorm');

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(locked && !watchOpen){
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    rgt.set( Math.cos(yaw), 0, -Math.sin(yaw));
    const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = sprint ? 10.5 : 6.5;
    const ix = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
    const iz = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
    const tx = (fwd.x * iz + rgt.x * ix) * speed;
    const tz = (fwd.z * iz + rgt.z * ix) * speed;
    const k = 1 - Math.pow(0.0001, dt);
    vel.x += (tx - vel.x) * k;
    vel.z += (tz - vel.z) * k;
    vel.y -= 22 * dt;
    if(grounded && keys['Space']){ vel.y = 8.6; grounded = false; }

    pos.x += vel.x * dt; collideHoriz();
    pos.z += vel.z * dt; collideHoriz();
    pos.y += vel.y * dt;
    const s = supportAt(pos.x, pos.z, pos.y);
    if(pos.y <= s){ pos.y = s; vel.y = 0; grounded = true; }
    else grounded = false;

    if(grounded){
      for(const p of pads){
        const dx = pos.x - p.x, dz = pos.z - p.z;
        if(dx*dx + dz*dz < p.r * p.r){ vel.y = 16; grounded = false; break; }
      }
    }
  }

  for(const b of balls){
    b.vel.y -= 20 * dt;
    b.pos.addScaledVector(b.vel, dt);
    if(b.pos.y < b.r){ b.pos.y = b.r; b.vel.y *= -0.72; b.vel.x *= .985; b.vel.z *= .985; }
    const lim = WALL - 1;
    if(b.pos.x < -lim + b.r){ b.pos.x = -lim + b.r; b.vel.x *= -0.8; }
    if(b.pos.x >  lim - b.r){ b.pos.x =  lim - b.r; b.vel.x *= -0.8; }
    if(b.pos.z < -lim + b.r){ b.pos.z = -lim + b.r; b.vel.z *= -0.8; }
    if(b.pos.z >  lim - b.r){ b.pos.z =  lim - b.r; b.vel.z *= -0.8; }
    if(locked && !watchOpen){
      const dx = b.pos.x - pos.x, dz = b.pos.z - pos.z;
      const d = Math.hypot(dx, dz);
      if(d < b.r + 0.75 && Math.abs(b.pos.y - (pos.y + 0.9)) < 1.7 && d > 0.001){
        b.vel.x += dx / d * 7 + vel.x * 0.5;
        b.vel.z += dz / d * 7 + vel.z * 0.5;
        b.vel.y += 2.5;
      }
    }
    b.mesh.position.copy(b.pos);
    b.mesh.rotation.x += b.vel.z * dt * 0.9;
    b.mesh.rotation.z -= b.vel.x * dt * 0.9;
  }

  camera.position.set(pos.x, pos.y + 1.65, pos.z);
  renderer.render(scene, camera);
}
tick();
</script>

  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0e1a;

  /* ---------- loading ---------- */
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;

  #loading .bar { width:min(380px,80vw); height:10px; background:rgba(255,255,255,.12);

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; z-index:20; pointer-events:none; }

  #backpack h3 { margin:0 0 14px; text-align:center; font-size:20px; }
  #backpack .wbtn { display:block; width:100%; margin:8px 0; padding:14px; font-size:16px; font-weight:700;

  #backpack .wbtn.wclose { margin-top:6px; background:rgba(255,255,255,.04); }
  .bp-item { display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:12px; padding:12px 14px; margin:8px 0; font-size:16px; font-weight:600; }
  .bp-use { padding:8px 18px; font-size:14px; font-weight:700; color:#fff; cursor:pointer;
    background:rgba(255,106,43,.35); border:1px solid rgba(255,106,43,.6); border-radius:10px; }
  .bp-use.equipped { background:rgba(80,200,120,.3); border-color:rgba(80,200,120,.6); }

  /* ---------- photo viewer ---------- */
  #photo { position:fixed; z-index:35; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(10,14,26,.95); border:1px solid rgba(255,255,255,.14); border-radius:18px;
    padding:20px; width:min(560px,92vw); }
  #photo.hidden { display:none; }
  #photo h3 { margin:0 0 12px; text-align:center; font-size:20px; }
  #photo-img { width:100%; border-radius:12px; display:block; background:#000; }
  #photo .ph-btns { display:flex; gap:8px; margin-top:12px; }
  #photo .ph-btns button { flex:1; padding:12px; font-size:15px; font-weight:700; color:#fff;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    border-radius:12px; cursor:pointer; }
  #photo #ph-png { background:rgba(80,200,120,.25); border-color:rgba(80,200,120,.5); }
  #photo #ph-recnet { background:rgba(255,106,43,.22); border-color:rgba(255,106,43,.5); }
  #flash { position:fixed; inset:0; z-index:44; background:#fff; opacity:0; pointer-events:none; }

  /* ---------- camera viewfinder ---------- */
  #cammode { position:fixed; inset:0; z-index:25; pointer-events:none; }
  #cammode.hidden { display:none; }
  .vf-corner { position:absolute; width:46px; height:46px; border:3px solid rgba(255,255,255,.85); }
  .vf-corner.tl { top:20px; left:20px; border-right:none; border-bottom:none; border-top-left-radius:10px; }
  .vf-corner.tr { top:20px; right:20px; border-left:none; border-bottom:none; border-top-right-radius:10px; }
  .vf-corner.bl { bottom:20px; left:20px; border-right:none; border-top:none; border-bottom-left-radius:10px; }
  .vf-corner.br { bottom:20px; right:20px; border-left:none; border-top:none; border-bottom-right-radius:10px; }
  .vf-top { position:absolute; top:28px; left:50%; transform:translateX(-50%); color:#fff;

  #cam-snap { position:absolute; bottom:36px; left:50%; transform:translateX(-50%);

    box-shadow:0 4px 18px rgba(0,0,0,.5); }
  #cam-snap:active { transform:translateX(-50%) scale(.92); }
  #cam-away { position:absolute; bottom:52px; right:26px; pointer-events:auto; cursor:pointer;
    padding:10px 16px; font-size:14px; font-weight:700; color:#fff;
    background:rgba(10,13,25,.75); border:1px solid rgba(255,255,255,.2); border-radius:12px; }

  #toast { position:fixed; z-index:40; bottom:26px; left:50%; transform:translateX(-50%);
    background:rgba(10,13,25,.9); color:#ffd9a8; font-size:14px; padding:10px 20px;
    border-radius:999px; border:1px solid rgba(255,255,255,.1); opacity:0; transition:opacity .3s;
    pointer-events:none; white-space:nowrap; }
  #hint { position:fixed; z-index:20; bottom:14px; left:14px; color:#aab; font-size:12.5px;
    background:rgba(10,13,25,.7); padding:8px 14px; border-radius:10px; pointer-events:none; }
  #hint b { color:#fff; }

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================== helpers ============================== */
const $ = id => document.getElementById(id);
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(()=> t.style.opacity = 0, 2200);
}
function textTex(lines, W, H, bg, colors, fonts){
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.fillStyle = bg; cx.fillRect(0,0,W,H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  lines.forEach((ln,i)=>{
    cx.fillStyle = Array.isArray(colors) ? colors[i%colors.length] : colors;
    cx.font = Array.isArray(fonts) ? fonts[i%fonts.length] : fonts;
    cx.fillText(ln, W/2, H*(i+1)/(lines.length+1));
  });
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function box(w,h,d,mat,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true; return m;
}

/* ============================== renderer / world ============================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e1a);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 400);
const rig = new THREE.Group();
rig.add(camera); scene.add(rig);
const EYE = 1.6;

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x334, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.2);
sun.position.set(6, 14, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);

const M = {
  wall:   new THREE.MeshStandardMaterial({ color:0xf3e9d4, roughness:.95 }),
  stripe: new THREE.MeshStandardMaterial({ color:0xe8822a, roughness:.9 }),
  wood:   new THREE.MeshStandardMaterial({ color:0x9a6b3f, roughness:.8 }),
  woodD:  new THREE.MeshStandardMaterial({ color:0x6f4a28, roughness:.8 }),
  white:  new THREE.MeshStandardMaterial({ color:0xf5f5f5, roughness:.6 }),
  black:  new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:.7 }),
  blue:   new THREE.MeshStandardMaterial({ color:0x2a6fd6, roughness:.7 }),
};

const dorm = new THREE.Group();   // Avery's .glb dorm
const rec  = new THREE.Group();   // rec center
rec.visible = false;
scene.add(dorm, rec);

/* ============================== MODELS (.glb) ============================== */
const dormState = { ready:false, floorY:0, minX:-4, maxX:4, minZ:-4, maxZ:4, cx:0, cz:0 };
const recState  = { ready:false, floorY:1.0, spawnX:-9, spawnZ:-15, yaw:Math.PI };
const loadMgr = new THREE.LoadingManager();
loadMgr.onProgress = (url, loaded, total)=>{
  $('loadfill').style.width = Math.round(loaded/total*100) + '%';
};
function checkAllLoaded(){
  if(!(dormState.ready && recState.ready)) return;
  gotoPlace('dorm');
  $('loading').classList.add('hidden');
  ['hud','hint'].forEach(id=> $(id).classList.remove('hidden'));
  toast('Welcome to your dorm 🛏️');
}
function loadDorm(){
  const loader = new GLTFLoader(loadMgr);
  // dorm.glb lives in the repo root (Avery uploads it via GitHub web UI)
  loader.load('dorm.glb',
    (gltf)=>{
      const model = gltf.scene;
      // perf: 1395 meshes — no shadow casting on the dorm, receive only
      model.traverse(o=>{ if(o.isMesh){ o.castShadow = false; o.receiveShadow = true; } });
      dorm.add(model);
      // bounds
      const bb = new THREE.Box3().setFromObject(model);
      const ctr = bb.getCenter(new THREE.Vector3());
      dormState.cx = ctr.x; dormState.cz = ctr.z;
      dormState.minX = bb.min.x + .45; dormState.maxX = bb.max.x - .45;
      dormState.minZ = bb.min.z + .45; dormState.maxZ = bb.max.z - .45;
      // floor: raycast down from just under the overhead platform (y=1.0)
      // at the spawn point — first hit is the surface we stand on.
      // (Casting from above the model hits the roof; from y=2.0 hits the platform.)
      const spawnX = 2.0, spawnZ = 0.0;
      const rc = new THREE.Raycaster(
        new THREE.Vector3(spawnX, 1.0, spawnZ),
        new THREE.Vector3(0,-1,0));
      const hits = rc.intersectObject(model, true);
      dormState.floorY = hits.length ? hits[0].point.y : -1.5;
      dormState.spawnX = spawnX; dormState.spawnZ = spawnZ;
      dormState.ready = true;
      checkAllLoaded();
    },
    undefined,
    (err)=>{
      $('loadst').textContent = 'Could not load dorm.glb — ' + err.message;
      console.error(err);
    });
}
function loadRecCenter(){
  const loader = new GLTFLoader(loadMgr);
  // reccenter.glb lives in the repo root (Avery uploads it via GitHub web UI)
  loader.load('reccenter.glb',
    (gltf)=>{
      const model = gltf.scene;
      model.traverse(o=>{ if(o.isMesh){ o.castShadow = false; o.receiveShadow = true; } });
      rec.add(model);
      // floor: raycast down from y=0 (under the upper walkways) at the spawn
      const rc = new THREE.Raycaster(
        new THREE.Vector3(recState.spawnX, 5.0, recState.spawnZ),
        new THREE.Vector3(0,-1,0));
      const hits = rc.intersectObject(model, true);
      recState.floorY = hits.length ? hits[0].point.y : -2.5;
      recState.ready = true;
      checkAllLoaded();
    },
    undefined,
    (err)=>{
      $('loadst').textContent = 'Could not load reccenter.glb — ' + err.message;
      console.error(err);
    });
}

/* (rec center now loads from reccenter.glb — see loadRecCenter above) */

/* ---- collision grids baked from the .glb models (walls/furniture) ----
   dorm: 0.25 cells over x -4.3..5.2, z -5.9..4.1
   rec:  0.5 cells over x -30..12, z -38..18 */
function makeGrid(x0,z0,cell,nx,nz,b64){
  const s=atob(b64); const bits=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bits[i]=s.charCodeAt(i);
  return { x0,z0,cell,nx,nz,bits };
}
const GRIDS = {
  dorm: makeGrid(-4.3,-5.9,0.25,38,40,
    "/4P/+AP////wD////8ABgAAHAAYAABwAGAAAcABgAAHAAYAABwAGAAAcAB////AAf///wAHgf/8AB4H//AAeB7/wAHgAD8AB4AA/AAYAAPwAGAAD8ABgAA//wfwAP/8H/+AMAB//gDAAf/4AwAH/+AMAB/AADAAfwAAwAH8AAMABvAADAAbwAHwAH8AB8AB/AAfAAfwAHwAH+AB8AB/4B/AAf+AfwAH/gH8AAf///AAH///wAB///8AB////AA=="),
  rec: makeGrid(-30.0,-38.0,0.5,84,112,
    "/////////////////wAAAAAAD//////wAAAAAAD//////wAAAAAAD///+AAAAAAB//AAA/+AAD//////AAA/+AAD//////wAA/+AAD//////wAA/+AAD//////wAA/+AAD//////wAA/+AAD//////wAA/+AAD/gAAP/wAA/+AAD/gAAP/wAA/+AAD/gAAADwAA/+AAB/gAAADwAA/+AAB/gAAADwAA/+AAB/gAAADwAA/+AAB/gAAADwAA/+AAB/gAAADwAA/+AAfwAAAADH///+AAfwAAAADH///+AAfwAAAADH///+AAfwAAAADH///+AAfwAAAADH///+AAfwAAAADx///+AAfwAAAADx///+AAfwAAA/8x///+AAfwAAA/8AAAA+AAfwAAO/wAAAA+AAfwAF8AAAAAA+AAfwC8AAAAAAA+AAfx6AAAAAAAA+AA/9AAAAcAAAA+Dw/8AAAAcAAAA+D//8AAAAcAAAA+D/wAAAAAAAAAA+D/wAAAAAAAAAA+D/wAAAAAAAAAA+B/wAAAAAAAAAA+D/wAAAAAAAAAA+D/wAAAAAAAAAA+D/wAAAAAAAAAA+D/wAAAAAAAAAA+B/wAAAAAAAAAA+B/wAAAAAAAAAAAB4AAAAAAAAAAAAAOAAAAAAAAAAAAAOAAAAAAAAAAAAAOAAAAAAAAAAAAAeAAAAAAAAAAAAAeAAAAAAAAAAAAB+AAAAAAAAAAAAB+AAAAAAAAAAAAB+AAAAAAAAAAAAB+AAAAAAAAAAAAB+AAAAAAAAAAAAB+AAAAAAAAAAAAB+AAAAcAAAAAAAB+AAAP8AAAAAAAB+AAAP4AAAAAAAB+AAAPgAAAAAAAB+AAAAAAAAAAAAB/AAAAAAAAAAAAB/AAAAAAAAAAcAB/AAAAAAAAAAdAAfAAAAAAAABgAAAHwAAAAAAACAAAAHwAAAAAAACAAAAHwAAAAAAACAAAAHwAAAAAAAAAAAH3wAAAAAAAAAAAPHwAAAAAAAAAAAAHwAAAAAAAAAAAP3////////+AAAP3////////+AAAAH4AAAAAAAB4AAAB4AAAAAAAB8AAAB4AAAAAAHh/4AAB4AAAAAAHwABAABwAAAAAABwAAAAB4AAAAAAAAAAAAB4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAEAAAAAAAAAAAAA8AAAAAAAAAAAAA8AAAAAAAAAAAAA+AAAAAAAAAAAAAGAAAAAAAAAAAAAHwAAAAAAAAAAAADwAAAAAAAAAAAADwAAAAAAAAAAAAD/gAAAAAAAAAAAAfgAAAAAAAAAAAAfgAAAAAAAAAAAAf+AAAAAAAAAAAAf+AAAAAAAAAAAAA+AAAAAAAAAAAAA/8AAAAAAAAAAAAD8A/+AAAAAAAAAD///+AAAAAAAAAAAAA+AAAAAAAAAAAAA+AAAAAAAAAAAAA+AAAAAAAAAAAAA+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//AAAAAAAAAAAD//"),
};
function cellBlocked(g,ix,iz){
  if(ix<0||iz<0||ix>=g.nx||iz>=g.nz) return true;
  const i=iz*g.nx+ix; return ((g.bits[i>>3]>>(7-(i&7)))&1)===1;
}
function solidAt(place,x,z){
  const g=GRIDS[place]; if(!g) return false;
  const r=0.28;   // player radius
  return cellBlocked(g,Math.floor((x-r-g.x0)/g.cell),Math.floor((z-r-g.z0)/g.cell)) ||
         cellBlocked(g,Math.floor((x+r-g.x0)/g.cell),Math.floor((z-r-g.z0)/g.cell)) ||
         cellBlocked(g,Math.floor((x-r-g.x0)/g.cell),Math.floor((z+r-g.z0)/g.cell)) ||
         cellBlocked(g,Math.floor((x+r-g.x0)/g.cell),Math.floor((z+r-g.z0)/g.cell));
}

/* ============================== places / teleport ============================== */
const PLACES = {
  dorm: { group:dorm, label:'🛏️ Dorm Room' },
  rec:  { group:rec,  label:'🏟️ Rec Center' },
};
let place = 'rec';   // rec visible until models load, then gotoPlace('dorm') runs
let yaw = 0, pitch = 0, vy = 0, grounded = true;
function allReady(){ return dormState.ready && recState.ready; }
function gotoPlace(name){
  PLACES[place].group.visible = false;
  place = name;
  PLACES[place].group.visible = true;
  if(name==='dorm' && dormState.ready){
    rig.position.set(dormState.spawnX, dormState.floorY, dormState.spawnZ);
    yaw = 1.75; pitch = 0;   // face the room's main area from the open east side
  } else if(name==='rec' && recState.ready){
    rig.position.set(recState.spawnX, recState.floorY, recState.spawnZ);
    yaw = recState.yaw; pitch = 0;
  } else if(PLACES[name].custom){
    const s = PLACES[name].spawn;
    rig.position.set(s.x, s.y, s.z);
    yaw = s.yaw; pitch = 0;
  } else {
    rig.position.set(0, 0, 10);
    yaw = Math.PI; pitch = 0;
  }
  vy = 0; grounded = true;
  $('loc').textContent = PLACES[place].label;
  renderWatchPlaces();
}

/* ============================== controls (PC + VR) ============================== */
const keys = {};
addEventListener('keydown', e=>{
  if(e.code==='Tab'){ e.preventDefault(); toggleWatch(); return; }
  if(e.code==='KeyC'){ snapPhoto(); return; }
  keys[e.code] = true;
  if(e.code==='Space') e.preventDefault();
});
addEventListener('keyup', e=> keys[e.code] = false);

let locked = false;
renderer.domElement.addEventListener('click', ()=>{
  if(!allReady() || !$('watch').classList.contains('hidden')) return;
  renderer.domElement.requestPointerLock?.();
});
document.addEventListener('pointerlockchange', ()=>{ locked = document.pointerLockElement === renderer.domElement; });
addEventListener('mousemove', e=>{
  if(!locked) return;
  yaw   -= e.movementX * .0024;
  pitch -= e.movementY * .0024;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});
function toggleWatch(){
  if(!allReady()) return;
  $('watch').classList.toggle('hidden');
  if(!$('watch').classList.contains('hidden')) document.exitPointerLock?.();
}
$('w-close').onclick = toggleWatch;
function renderWatchPlaces(){
  const c = $('w-places'); c.innerHTML = '';
  for(const key of Object.keys(PLACES)){
    const b = document.createElement('button');
    b.className = 'wbtn'; b.textContent = PLACES[key].label;
    b.disabled = (key === place);
    b.onclick = ()=>{ gotoPlace(key); toggleWatch(); };
    c.appendChild(b);
  }
}

/* ---------- backpack + maker pen + room creation ---------- */
let makerPenEquipped = false, roomCount = 0;
$('w-backpack').onclick = ()=>{
  $('watch').classList.add('hidden');
  $('backpack').classList.remove('hidden');
};
$('bp-close').onclick = ()=>{
  $('backpack').classList.add('hidden');
  $('watch').classList.remove('hidden');
};
$('bp-pen').onclick = ()=>{
  makerPenEquipped = !makerPenEquipped;
  $('bp-pen').textContent = makerPenEquipped ? 'Unequip' : 'Use';
  $('bp-pen').classList.toggle('equipped', makerPenEquipped);
  toast(makerPenEquipped ? '🖊️ Maker Pen equipped!' : '🖊️ Maker Pen put away');
};
/* ---------- camera: snap photos ---------- */
let cameraEquipped = false, AC = null;
function setCameraEquipped(on){
  cameraEquipped = on;
  $('bp-cam').textContent = on ? 'Unequip' : 'Use';
  $('bp-cam').classList.toggle('equipped', on);
  $('cammode').classList.toggle('hidden', !on);
  if(on) document.exitPointerLock?.();
  toast(on ? '📷 Camera equipped!' : '📷 Camera put away');
}
$('bp-cam').onclick = ()=> setCameraEquipped(!cameraEquipped);
$('cam-away').onclick = ()=> setCameraEquipped(false);
$('cam-snap').onclick = ()=> snapPhoto();
function shutter(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(1800, t);
    o.frequency.exponentialRampToValueAtTime(400, t+0.07);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.09);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+0.1);
  }catch(e){}
}
function snapPhoto(){
  if(!cameraEquipped || !$('photo').classList.contains('hidden') || !allReady()) return;
  renderer.render(scene, camera);
  $('photo-img').src = renderer.domElement.toDataURL('image/png');
  $('photo').classList.remove('hidden');
  document.exitPointerLock?.();
  shutter();
  const f = $('flash');
  f.style.transition = 'none'; f.style.opacity = 0.85;
  requestAnimationFrame(()=>{ f.style.transition = 'opacity .45s'; f.style.opacity = 0; });
}
$('ph-recnet').onclick = ()=> alert('coming soon');
$('ph-png').onclick = ()=>{
  const a = document.createElement('a');
  a.href = $('photo-img').src;
  a.download = 'recnova-photo.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('💾 Photo saved!');
};
$('ph-close').onclick = ()=> $('photo').classList.add('hidden');
function makeRoom(){
  const g = new THREE.Group(), S = 6;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(S*2,S*2),
    new THREE.MeshStandardMaterial({ color:0x9a9a9a }));
  floor.rotation.x = -Math.PI/2; g.add(floor);
  const wm = new THREE.MeshStandardMaterial({ color:0x4a6fa5 });
  const wall = (x,z,ry)=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(S*2,4), wm);
    m.position.set(x,2,z); m.rotation.y = ry; g.add(m);
  };
  wall(0,-S,0); wall(0,S,Math.PI); wall(-S,0,Math.PI/2); wall(S,0,-Math.PI/2);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(S*2,S*2),
    new THREE.MeshStandardMaterial({ color:0x2e3440 }));
  ceil.rotation.x = Math.PI/2; ceil.position.y = 4; g.add(ceil);
  return g;
}
$('w-create').onclick = ()=>{
  if(!makerPenEquipped){ toast('⚠️ Equip the Maker Pen from your backpack first!'); return; }
  roomCount++;
  const key = 'room'+roomCount;
  const label = '🏠 My Room' + (roomCount>1 ? ' '+roomCount : '');
  const group = makeRoom();
  group.visible = false;
  scene.add(group);
  PLACES[key] = { group, label, custom:true,
    spawn:{ x:0, y:0, z:0, yaw:0 }, bounds:5 };
  renderWatchPlaces();
  gotoPlace(key);
  toggleWatch();
  toast('🏠 Room created!');
};

/* VR */
renderer.xr.enabled = true;
document.body.appendChild(VRButton.createButton(renderer));
const ctrl = [renderer.xr.getController(0), renderer.xr.getController(1)];
ctrl.forEach(c=> rig.add(c));

/* ============================== loop ============================== */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3();
function floorY(){ return PLACES[place].custom ? 0 : place==='dorm' ? dormState.floorY : recState.floorY; }
function placeReady(){ return PLACES[place].custom ? true : place==='dorm' ? dormState.ready : recState.ready; }
function stepPlayer(dt){
  const sp = (keys.ShiftLeft||keys.ShiftRight) ? 7 : 4.2;
  fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); rgt.set(-fwd.z,0,fwd.x);
  const mv = new THREE.Vector3();
  if(keys.KeyW) mv.add(fwd); if(keys.KeyS) mv.sub(fwd);
  if(keys.KeyD) mv.add(rgt); if(keys.KeyA) mv.sub(rgt);
  if(mv.lengthSq()>0){
    mv.normalize().multiplyScalar(sp*dt);
    if(placeReady()){
      // axis-separated collision so you slide along walls instead of sticking
      const nx = rig.position.x + mv.x;
      if(!solidAt(place, nx, rig.position.z)) rig.position.x = nx;
      const nz = rig.position.z + mv.z;
      if(!solidAt(place, rig.position.x, nz)) rig.position.z = nz;
    } else rig.position.add(mv);
  }
  if(keys.Space && grounded){ vy = 5.2; grounded = false; }
  vy -= 14*dt; rig.position.y += vy*dt;
  const fy = floorY();
  if(rig.position.y <= fy){ rig.position.y = fy; vy = 0; grounded = true; }
  const lim = PLACES[place].custom
    ? { x0:-PLACES[place].bounds, x1:PLACES[place].bounds, z0:-PLACES[place].bounds, z1:PLACES[place].bounds }
    : place==='dorm'
    ? { x0:dormState.minX, x1:dormState.maxX, z0:dormState.minZ, z1:dormState.maxZ }
    : { x0:-29, x1:11, z0:-37, z1:17 };
  rig.position.x = Math.max(lim.x0, Math.min(lim.x1, rig.position.x));
  rig.position.z = Math.max(lim.z0, Math.min(lim.z1, rig.position.z));
}
function stepVR(dt){
  if(!renderer.xr.isPresenting) return;
  const gp = ctrl[0]?.gamepad;
  if(gp){
    fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); rgt.set(-fwd.z,0,fwd.x);
    const mv = new THREE.Vector3()
      .addScaledVector(fwd, -(gp.axes[3]||0))
      .addScaledVector(rgt,  (gp.axes[2]||0));
    if(mv.lengthSq()>0.0004){
      mv.normalize();
      const step = mv.multiplyScalar(4*dt);
      if(placeReady()){
        const nx = rig.position.x + step.x;
        if(!solidAt(place, nx, rig.position.z)) rig.position.x = nx;
        const nz = rig.position.z + step.z;
        if(!solidAt(place, rig.position.x, nz)) rig.position.z = nz;
      } else rig.position.add(step);
    }
  }
  const gp2 = ctrl[1]?.gamepad;
  if(gp2){
    const x = gp2.axes[2]||0;
    if(Math.abs(x) > .7 && !stepVR._t){ yaw -= Math.sign(x)*Math.PI/6; stepVR._t = true; }
    if(Math.abs(x) < .3) stepVR._t = false;
  }
}
function animate(){
  renderer.setAnimationLoop(()=>{
    const dt = Math.min(clock.getDelta(), .05);
    if(allReady() && !renderer.xr.isPresenting) stepPlayer(dt);
    if(allReady()) stepVR(dt);
    camera.position.set(0, EYE, 0);   // rig carries feet height
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitch, yaw, 0);
    renderer.render(scene, camera);
  });
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
gotoPlace('rec');   // show rec center behind the loading screen
loadDorm();
loadRecCenter();
animate();
</script>

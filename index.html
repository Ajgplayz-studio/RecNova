<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (location.hostname.indexOf('github.io') !== -1) {
  location.replace('https://recnova.foxcorpgames.workers.dev/' + location.search + location.hash);
}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RecNova</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0e1a;
    font-family:'Segoe UI', system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { display:block; }
  .hidden { display:none !important; }

  /* ---------- loading ---------- */
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(1000px 700px at 50% 20%, #232c52 0%, #141a30 55%, #0b0e1a 100%);
    color:#fff; }
  #loading .logo { font-size:52px; font-weight:900; letter-spacing:2px; }
  #loading .logo span { color:#ff6a2b; }
  #loading .bar { width:min(380px,80vw); height:10px; background:rgba(255,255,255,.12);
    border-radius:99px; overflow:hidden; }
  #loading .bar i { display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#ff8c42,#ff3d5a); transition:width .2s; }
  #loading .st { color:#8f9bb8; font-size:14px; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; z-index:20; pointer-events:none; }
  #cross { position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px;
    background:#fff; border-radius:50%; opacity:.85; box-shadow:0 0 4px rgba(0,0,0,.6); }
  #loc { position:absolute; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(10,13,25,.8); border:1px solid rgba(255,255,255,.12); color:#fff;
    padding:8px 20px; border-radius:999px; font-size:14px; font-weight:600; }

  /* ---------- watch ---------- */
  #watch { position:fixed; z-index:30; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(380px, 90vw); background:rgba(14,17,30,.96); border:2px solid #2a3352;
    border-radius:22px; padding:22px; color:#fff; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #watch h3 { margin:0 0 14px; text-align:center; font-size:20px; }
  #watch .wbtn { display:block; width:100%; margin:8px 0; padding:14px; font-size:16px; font-weight:700;
    color:#fff; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; cursor:pointer; }
  #watch .wbtn:hover:not(:disabled) { background:rgba(255,106,43,.35); }
  #watch .wbtn:disabled { opacity:.35; cursor:default; }
  #watch .wclose { margin-top:6px; background:rgba(255,255,255,.04); }

  #toast { position:fixed; z-index:40; bottom:26px; left:50%; transform:translateX(-50%);
    background:rgba(10,13,25,.9); color:#ffd9a8; font-size:14px; padding:10px 20px;
    border-radius:999px; border:1px solid rgba(255,255,255,.1); opacity:0; transition:opacity .3s;
    pointer-events:none; white-space:nowrap; }
  #hint { position:fixed; z-index:20; bottom:14px; left:14px; color:#aab; font-size:12.5px;
    background:rgba(10,13,25,.7); padding:8px 14px; border-radius:10px; pointer-events:none; }
  #hint b { color:#fff; }
</style>
</head>
<body>
<div id="loading">
  <div class="logo">REC<span>NOVA</span></div>
  <div class="bar"><i id="loadfill"></i></div>
  <div class="st" id="loadst">Loading your dorm…</div>
</div>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="loc">🛏️ Dorm Room</div>
</div>
<div id="watch" class="hidden">
  <h3>⌚ Watch</h3>
  <button class="wbtn" id="w-dorm">🛏️ Dorm Room</button>
  <button class="wbtn" id="w-rec">🏟️ Rec Center</button>
  <button class="wbtn wclose" id="w-close">Close</button>
</div>
<div id="toast"></div>
<div id="hint" class="hidden"><b>WASD</b> move · <b>mouse</b> look · <b>Tab</b> watch · <b>Space</b> jump</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================== helpers ============================== */
const $ = id => document.getElementById(id);
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(()=> t.style.opacity = 0, 2200);
}
function textTex(lines, W, H, bg, colors, fonts){
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.fillStyle = bg; cx.fillRect(0,0,W,H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  lines.forEach((ln,i)=>{
    cx.fillStyle = Array.isArray(colors) ? colors[i%colors.length] : colors;
    cx.font = Array.isArray(fonts) ? fonts[i%fonts.length] : fonts;
    cx.fillText(ln, W/2, H*(i+1)/(lines.length+1));
  });
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function box(w,h,d,mat,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true; return m;
}

/* ============================== renderer / world ============================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e1a);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 400);
const rig = new THREE.Group();
rig.add(camera); scene.add(rig);
const EYE = 1.6;

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x334, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.2);
sun.position.set(6, 14, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);

const M = {
  wall:   new THREE.MeshStandardMaterial({ color:0xf3e9d4, roughness:.95 }),
  stripe: new THREE.MeshStandardMaterial({ color:0xe8822a, roughness:.9 }),
  wood:   new THREE.MeshStandardMaterial({ color:0x9a6b3f, roughness:.8 }),
  woodD:  new THREE.MeshStandardMaterial({ color:0x6f4a28, roughness:.8 }),
  white:  new THREE.MeshStandardMaterial({ color:0xf5f5f5, roughness:.6 }),
  black:  new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:.7 }),
  blue:   new THREE.MeshStandardMaterial({ color:0x2a6fd6, roughness:.7 }),
};

const dorm = new THREE.Group();   // Avery's .glb dorm
const rec  = new THREE.Group();   // rec center
rec.visible = false;
scene.add(dorm, rec);

/* ============================== DORM (.glb) ============================== */
const dormState = { ready:false, floorY:0, minX:-4, maxX:4, minZ:-4, maxZ:4, cx:0, cz:0 };
function loadDorm(){
  const mgr = new THREE.LoadingManager();
  mgr.onProgress = (url, loaded, total)=>{
    $('loadfill').style.width = Math.round(loaded/total*100) + '%';
  };
  const loader = new GLTFLoader(mgr);
  // Avery's dorm .glb, hosted on their Google Drive (CORS-open)
  const DORM_URL = 'https://drive.usercontent.google.com/download?id=1eEj9xTQo9y_jjUiyB5YfUMtfgo4l_qGz&export=download';
  loader.load(DORM_URL,
    (gltf)=>{
      const model = gltf.scene;
      // perf: 1395 meshes — no shadow casting on the dorm, receive only
      model.traverse(o=>{ if(o.isMesh){ o.castShadow = false; o.receiveShadow = true; } });
      dorm.add(model);
      // bounds
      const bb = new THREE.Box3().setFromObject(model);
      const size = bb.getSize(new THREE.Vector3());
      const ctr = bb.getCenter(new THREE.Vector3());
      dormState.cx = ctr.x; dormState.cz = ctr.z;
      dormState.minX = bb.min.x + .45; dormState.maxX = bb.max.x - .45;
      dormState.minZ = bb.min.z + .45; dormState.maxZ = bb.max.z - .45;
      // floor: raycast down through the room center
      const rc = new THREE.Raycaster(
        new THREE.Vector3(ctr.x, bb.max.y + 1, ctr.z),
        new THREE.Vector3(0,-1,0));
      const hits = rc.intersectObject(model, true);
      dormState.floorY = hits.length ? hits[0].point.y : bb.min.y;
      dormState.ready = true;
      gotoPlace('dorm');
      $('loading').classList.add('hidden');
      ['hud','hint'].forEach(id=> $(id).classList.remove('hidden'));
      toast('Welcome to your dorm 🛏️');
    },
    undefined,
    (err)=>{
      $('loadst').textContent = 'Could not load dorm.glb — ' + err.message;
      console.error(err);
    });
}

/* ============================== REC CENTER (simple) ============================== */
function buildRecCenter(){
  const g = new THREE.Group();
  const W=40, D=30, H=8;
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(W,D),
    new THREE.MeshStandardMaterial({ color:0xd8b078, roughness:.9 }));
  fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; g.add(fl);
  [[0,-D/2,W,0],[0,D/2,W,0],[-W/2,0,D,1],[W/2,0,D,1]].forEach(([x,z,w,side])=>{
    g.add(box(side? .4:w, H, side? w:.4, M.wall, x, H/2, z));
    g.add(box(side? .44:w, 1.2, side? w:.44, M.stripe, x, 3, z));
  });
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W,D), M.wall);
  ceil.rotation.x=Math.PI/2; ceil.position.y=H; g.add(ceil);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(10,2.4),
    new THREE.MeshBasicMaterial({ map:textTex(['★ REC CENTER ★'],1024,256,'#e8822a',['#fff'],['bold 110px sans-serif']) }));
  sign.position.set(0,5.4,-D/2+.3); g.add(sign);
  const acts=[['⚽','SPORTS',-12],['🎯','GAMES',-4],['🎪','EVENTS',4],['🛠️','CREATE',12]];
  acts.forEach(([em,name,x])=>{
    g.add(box(3,4.4,.3,M.woodD, x, 2.2, -D/2+.3));
    const s = new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.2),
      new THREE.MeshBasicMaterial({ map:textTex([em,name],512,256,'#1c2338',['#fff','#ffb27a'],['90px sans-serif','bold 64px sans-serif']) }));
    s.position.set(x,4.9,-D/2+.5); g.add(s);
  });
  g.add(box(3,.18,3,M.wood, 0,.9,0));
  [[-1.3,-1.3],[1.3,-1.3],[-1.3,1.3],[1.3,1.3]].forEach(([dx,dz])=> g.add(box(.18,.9,.18,M.woodD, dx,.45,dz)));
  g.add(box(1.5,2.9,.2,M.woodD, 0,1.45,D/2-.15));
  const ds = new THREE.Mesh(new THREE.PlaneGeometry(1.6,.5),
    new THREE.MeshBasicMaterial({ map:textTex(['🛏️ DORM →'],512,160,'#2a6fd6',['#fff'],['bold 56px sans-serif']) }));
  ds.position.set(0,3.1,D/2-.3); ds.rotation.y=Math.PI; g.add(ds);
  [[-8,6,-6],[8,6,-6],[-8,6,6],[8,6,6]].forEach(([x,y,z])=>{
    const p = new THREE.PointLight(0xfff0d8, 30, 30); p.position.set(x,y,z); g.add(p);
  });
  return g;
}
rec.add(buildRecCenter());

/* ============================== places / teleport ============================== */
const PLACES = {
  dorm: { group:dorm, label:'🛏️ Dorm Room' },
  rec:  { group:rec,  label:'🏟️ Rec Center' },
};
let place = 'rec';   // rec visible until dorm loads, then gotoPlace('dorm') runs
let yaw = 0, pitch = 0, vy = 0, grounded = true;
function gotoPlace(name){
  PLACES[place].group.visible = false;
  place = name;
  PLACES[place].group.visible = true;
  if(name==='dorm' && dormState.ready){
    rig.position.set(dormState.cx, dormState.floorY, dormState.cz + 2.5);
    yaw = 0; pitch = 0;   // face -z, toward room center
  } else {
    rig.position.set(0, 0, 10);
    yaw = Math.PI; pitch = 0;
  }
  vy = 0; grounded = true;
  $('loc').textContent = PLACES[place].label;
  $('w-dorm').disabled = (name==='dorm');
  $('w-rec').disabled  = (name==='rec');
}

/* ============================== controls (PC + VR) ============================== */
const keys = {};
addEventListener('keydown', e=>{
  if(e.code==='Tab'){ e.preventDefault(); toggleWatch(); return; }
  keys[e.code] = true;
  if(e.code==='Space') e.preventDefault();
});
addEventListener('keyup', e=> keys[e.code] = false);

let locked = false;
renderer.domElement.addEventListener('click', ()=>{
  if(!dormState.ready || !$('watch').classList.contains('hidden')) return;
  renderer.domElement.requestPointerLock?.();
});
document.addEventListener('pointerlockchange', ()=>{ locked = document.pointerLockElement === renderer.domElement; });
addEventListener('mousemove', e=>{
  if(!locked) return;
  yaw   -= e.movementX * .0024;
  pitch -= e.movementY * .0024;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});
function toggleWatch(){
  if(!dormState.ready) return;
  $('watch').classList.toggle('hidden');
  if(!$('watch').classList.contains('hidden')) document.exitPointerLock?.();
}
$('w-close').onclick = toggleWatch;
$('w-dorm').onclick = ()=>{ gotoPlace('dorm'); toggleWatch(); };
$('w-rec').onclick  = ()=>{ gotoPlace('rec');  toggleWatch(); };

/* VR */
renderer.xr.enabled = true;
document.body.appendChild(VRButton.createButton(renderer));
const ctrl = [renderer.xr.getController(0), renderer.xr.getController(1)];
ctrl.forEach(c=> rig.add(c));

/* ============================== loop ============================== */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3();
function floorY(){ return place==='dorm' ? dormState.floorY : 0; }
function stepPlayer(dt){
  const sp = (keys.ShiftLeft||keys.ShiftRight) ? 7 : 4.2;
  fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); rgt.set(-fwd.z,0,fwd.x);
  const mv = new THREE.Vector3();
  if(keys.KeyW) mv.add(fwd); if(keys.KeyS) mv.sub(fwd);
  if(keys.KeyD) mv.add(rgt); if(keys.KeyA) mv.sub(rgt);
  if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(sp*dt); rig.position.add(mv); }
  if(keys.Space && grounded){ vy = 5.2; grounded = false; }
  vy -= 14*dt; rig.position.y += vy*dt;
  const fy = floorY();
  if(rig.position.y <= fy){ rig.position.y = fy; vy = 0; grounded = true; }
  const lim = place==='dorm'
    ? { x0:dormState.minX, x1:dormState.maxX, z0:dormState.minZ, z1:dormState.maxZ }
    : { x0:-18, x1:18, z0:-13, z1:13 };
  rig.position.x = Math.max(lim.x0, Math.min(lim.x1, rig.position.x));
  rig.position.z = Math.max(lim.z0, Math.min(lim.z1, rig.position.z));
}
function stepVR(dt){
  if(!renderer.xr.isPresenting) return;
  const gp = ctrl[0]?.gamepad;
  if(gp){
    fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); rgt.set(-fwd.z,0,fwd.x);
    const mv = new THREE.Vector3()
      .addScaledVector(fwd, -(gp.axes[3]||0))
      .addScaledVector(rgt,  (gp.axes[2]||0));
    if(mv.lengthSq()>0.0004) rig.position.addScaledVector(mv.normalize(), 4*dt);
  }
  const gp2 = ctrl[1]?.gamepad;
  if(gp2){
    const x = gp2.axes[2]||0;
    if(Math.abs(x) > .7 && !stepVR._t){ yaw -= Math.sign(x)*Math.PI/6; stepVR._t = true; }
    if(Math.abs(x) < .3) stepVR._t = false;
  }
}
function animate(){
  renderer.setAnimationLoop(()=>{
    const dt = Math.min(clock.getDelta(), .05);
    if(dormState.ready && !renderer.xr.isPresenting) stepPlayer(dt);
    if(dormState.ready) stepVR(dt);
    camera.position.set(0, EYE, 0);   // rig carries feet height
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitch, yaw, 0);
    renderer.render(scene, camera);
  });
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
gotoPlace('rec');   // show rec center behind the loading screen
loadDorm();
animate();
</script>
</body>
</html>
